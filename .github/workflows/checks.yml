name: Project checks
on:
  push:
  pull_request:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest pypdf==5.4.0 python-docx==1.1.2
      - name: Compile application code
        run: python -m compileall -q backend frontend
      - name: Run focused tests
        run: python -m pytest -q tests/test_core.py
