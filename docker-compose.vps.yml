name: hybrid_rag

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      CHROMA_PATH: /data/chroma
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      RAG_DOMAIN: ${RAG_DOMAIN:?Set RAG_DOMAIN in .env}
      RAG_USER: ${RAG_USER:?Set RAG_USER in .env}
      RAG_PASSWORD_HASH: ${RAG_PASSWORD_HASH:?Set RAG_PASSWORD_HASH in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  neo4j_data:
  chroma_data:
  caddy_data:
  caddy_config:
